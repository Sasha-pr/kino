<h1>
  {{ title }}
</h1>
<p>Мой каталог фильмов</p>
@if (loading()) {
  <p>Загружаем фильмы</p>
} @else {
  @for (film of films(); track film.kinopoiskId) {
    <app-film-card
      [film]="film"
      [saved]="favorites.has(film.kinopoiskId)"
      (toggleFavorite)="favorites.toggle($event)"
    />
  }
}
