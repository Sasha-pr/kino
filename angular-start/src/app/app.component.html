<h1>
  {{ title }}
</h1>
<b>
  {{ age }}
</b>
<button (click)="plus()" [disabled]="buttonDisabled">Кнопка</button>
<img [src]="image" />

<p>Количество кликов {{ count() }}</p>
@if (available) {
  <button>Купить</button>
} @else {
  <p>Нет в наличии</p>
}

@for (product of products; track product.id) {
  <app-product-card (buy)="addToCart($event)" [product]="product">
  </app-product-card>
}
<div>В корзине {{ cartCount() }}</div>
